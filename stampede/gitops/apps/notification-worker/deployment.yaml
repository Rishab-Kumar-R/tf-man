apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: stampede
  labels:
    app: notification-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      serviceAccountName: notification-worker
      containers:
        - name: notification-worker
          image: registry.invalid/stampede/notification-worker:unset
          env:
            - name: SQS_QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: stampede-config
                  key: NOTIFICATION_WORKER_QUEUE_URL
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: stampede-config
                  key: REDIS_ADDR
            - name: CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: stampede-config
                  key: CONCURRENCY
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
