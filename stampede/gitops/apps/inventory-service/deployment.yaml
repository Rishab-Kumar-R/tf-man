apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: stampede
  labels:
    app: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      serviceAccountName: inventory-service
      containers:
        - name: inventory-service
          image: registry.invalid/stampede/inventory-service:unset
          env:
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: stampede-config
                  key: REDIS_ADDR
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: stampede
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8080
      targetPort: 8080
