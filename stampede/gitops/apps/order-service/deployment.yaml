apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: stampede
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      serviceAccountName: order-service
      containers:
        - name: order-service
          image: registry.invalid/stampede/order-service:unset
          env:
            - name: DB_SECRET_ARN
              valueFrom:
                configMapKeyRef:
                  name: stampede-config
                  key: ORDER_DB_SECRET_ARN
            - name: SNS_TOPIC_ARN
              valueFrom:
                configMapKeyRef:
                  name: stampede-config
                  key: EVENTS_TOPIC_ARN
            - name: ORDER_STATUS_QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: stampede-config
                  key: ORDER_SERVICE_STATUS_QUEUE_URL
            - name: INVENTORY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: stampede-config
                  key: INVENTORY_SERVICE_URL
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: stampede
spec:
  selector:
    app: order-service
  ports:
    - port: 8080
      targetPort: 8080
