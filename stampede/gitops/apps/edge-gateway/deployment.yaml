apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  namespace: stampede
  labels:
    app: edge-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-gateway
  template:
    metadata:
      labels:
        app: edge-gateway
    spec:
      serviceAccountName: edge-gateway
      containers:
        - name: edge-gateway
          image: registry.invalid/stampede/edge-gateway:unset
          env:
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: stampede-config
                  key: REDIS_ADDR
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: stampede-config
                  key: ORDER_SERVICE_URL
            - name: CATALOG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: stampede-config
                  key: CATALOG_SERVICE_URL
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway
  namespace: stampede
spec:
  selector:
    app: edge-gateway
  ports:
    - port: 8080
      targetPort: 8080
