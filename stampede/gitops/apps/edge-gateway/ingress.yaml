apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edge-gateway
  namespace: stampede
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/wafv2-acl-arn: PLACEHOLDER_SET_VIA_ARGOCD_KUSTOMIZE_PATCH
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge-gateway
                port:
                  number: 8080
